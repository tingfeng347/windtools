[package]
name = "windtools"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "A local todo list and an interactive meadow, in your terminal"
license = "MIT"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
directories = "6"
fs2 = "0.4"
ratatui = "0.30.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
unicode-segmentation = "1"
unicode-width = "0.2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
notify-rust = "4.18.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[[bench]]
name = "workloads"
harness = false
